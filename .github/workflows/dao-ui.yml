name: DAO UI CI/CD

on:
    push:
        paths:
          - "packages/ui/**"
          - ".github/workflows/dao-ui.yml"

    pull_request:
        types: [opened, synchronize, reopened, ready_for_review]
        paths:
        - "packages/ui/**"
        - ".github/workflows/dao-ui.yml"

permissions:
    contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
    test:
        if: ${{ github.event_name == 'push' || (github.event.pull_request.draft == false && github.actor != 'dependabot') }}
        runs-on: ubuntu-latest
        steps:
            - name: Install Git
              run: sudo apt-get update && sudo apt-get install -y git

            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install pnpm dependencies
              uses: ./.github/actions/install-pnpm-dependencies

            - name: Lint
              run: pnpm --filter dao-ui lint

            - name: Type-check
              run: pnpm --filter dao-ui type-check

            - name: Run tests
              run: pnpm --filter dao-ui test
